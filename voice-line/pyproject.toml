[project]
name = "voice-line"
version = "0.1.0"
description = "Hold-to-talk voice conversation system for talking to Claude out loud."
requires-python = ">=3.12,<3.13"
dependencies = [
    "sounddevice>=0.4.6",
    # webrtcvad itself needs a C compiler to build from source on Windows;
    # webrtcvad-wheels ships prebuilt Windows wheels and is a drop-in
    # replacement (still `import webrtcvad`).
    "webrtcvad-wheels>=2.0.14",
    "numpy>=1.26",
    "pynput>=1.7.6",
    "claude-agent-sdk>=0.1.0",
    "httpx>=0.27",
    # Per-app (Spotify) session volume for ducking -- Windows only.
    "pycaw>=20240210; sys_platform == 'win32'",
    # webrtcvad(-wheels)'s build path still reaches for pkg_resources;
    # setuptools 81 dropped it. Pin below that line.
    "setuptools<81",
]

[tool.uv]
package = false
