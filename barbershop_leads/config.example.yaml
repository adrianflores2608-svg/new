# ─────────────────────────────────────────────────────────────
#  Barbershop Leads System — Configuration
#  Copy this file to config.yaml and fill in your real values.
# ─────────────────────────────────────────────────────────────

# ── Google Places API ─────────────────────────────────────────
# Get your key at: https://console.cloud.google.com/
# Enable: Places API
google_places_api_key: "YOUR_GOOGLE_PLACES_API_KEY"

# ── Scraping settings ─────────────────────────────────────────
max_results_per_city: 20          # 1–60 (Places API max per search is 60)
delay_between_cities: 1.5         # seconds between city requests (be polite)

# ── Email sending settings ────────────────────────────────────
delay_between_emails: 3           # seconds between sends (avoid spam flags)

email:
  # provider options: "gmail" | "outlook" | "sendgrid" | "smtp"
  provider: "gmail"

  # ── Gmail / Outlook / generic SMTP ───────────────────────────
  smtp_host: "smtp.gmail.com"     # leave default for Gmail
  smtp_port: 587
  smtp_user: "you@gmail.com"
  smtp_password: "your_app_password"   # Gmail: use an App Password, not your main password
  # Gmail app password: https://myaccount.google.com/apppasswords

  # ── SendGrid (alternative) ───────────────────────────────────
  # provider: "sendgrid"
  # sendgrid_api_key: "SG.xxxx"
  # smtp_user: "apikey"           # always "apikey" for SendGrid SMTP relay

  # ── Sender identity ───────────────────────────────────────────
  sender_name: "Alex Carter"
  sender_title: "Founder, BarberGrow"
  sender_phone: "(555) 000-0000"
  reply_to: "you@gmail.com"

  # ── Links ──────────────────────────────────────────────────────
  demo_link: "https://yourdomain.com/demo"
  unsubscribe_link: "https://yourdomain.com/unsubscribe"
